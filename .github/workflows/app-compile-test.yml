name: app-compile-test
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'iVM full commit SHA', required: true }
permissions: { contents: read }
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahib3636-arch/ivm
          token: '${{ secrets.IVM_PAT }}'
          ref: '${{ inputs.ivm_ref }}'
          path: ivm-repo
          persist-credentials: false
          lfs: false
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compile app and run JVM launch-plan tests
        working-directory: ivm-repo/ivm/lab/m6/apk/ivm-app
        env: { CC: clang, CXX: clang++, JAVA_TOOL_OPTIONS: "-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2" }
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest --tests 'dev.ivm.emu.InfernoPlanTest' --tests 'dev.ivm.emu.BootPlanTest' --tests 'dev.ivm.emu.ShmFbTest' --tests 'dev.ivm.emu.PerfCoresTest' --tests 'dev.ivm.emu.VncReconnectTest' --tests 'dev.ivm.emu.CamFeedTest' --tests 'dev.ivm.emu.CameraConversionBenchmarkTest'

      - name: Preserve JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: ivm-repo/ivm/lab/m6/apk/ivm-app/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
