# Source of truth for ivm-ci/.github/workflows/micro.yml — run a native arm64 micro-benchmark/test script from the ivm repo.
name: micro
on:
  workflow_dispatch:
    inputs:
      script: { description: 'path in the ivm repo, e.g. ivm/bench/micro/bilerp.sh', required: true }
      ivm_ref: { default: 'main' }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false }
      - name: run
        working-directory: ivm-repo
        run: lscpu | head -20; bash "${{ inputs.script }}" 2>&1 | tee micro.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: micro-log, path: ivm-repo/micro.log }
