name: photos-test
on:
  workflow_dispatch:
    inputs:
      ivm_uset: { description: 'IVM_USET value to test (empty for default)', default: '' }
      ivm_ref: { description: 'ivm repo ref', default: 'main' }
      diskset: { description: 'disk set release tag (diskset-<name>-18A5351d)', default: 'diskset-setupdone-18A5351d' }
      base: { description: 'Inferno commit to build', default: '6541861f4d033a0de327b5ccc5180ebac20bf461' }
      patches: { description: 'IVM_PATCHES list (empty = none)', default: 'ispstub ktrace' }
      cc: { description: 'gcc | clang', default: 'gcc' }
      meson: { description: '1 = phone meson option set (IVM_MESON)', default: '0' }
      cam_shot: { description: '1 = take 2 shots before Photos (library non-empty); 0 = empty library', default: '1' }
      ktrace: { description: '1 = kernel data-abort trap; 2 = also BRK trap; 3 = kill trace (brk+triage+psignal+memorystatus+exit1, PCs from this kernelcache)', default: '0' }
      photos_via: { description: "'' = Photos icon/Spotlight; viewer = open Photos from the Camera thumbnail", default: '' }
      photos_launch: { description: "'' = Photos home-icon tap (E13 config, reproduces the crash); spotlight = Spotlight search", default: '' }
      metal_single: { description: '1 = single TCG thread for opt-in experimental live buffer test', default: '0' }
      ffi_run: { description: 'Optional ARM FFI workflow run ID for network-isolated guest library parse diagnostic', default: '' }
      library_probe: { description: '1 = read default.metallib header in guest; system code only', default: '0' }
      limits_discovery: { description: '1 = diagnostic nil-limits instruction bypass, NOT a Metal implementation', default: '0' }
      live_library: { description: '1 = parsed library; probe = also inspect specialization selector; needs ffi_run and library_probe', default: '0' }
      live_command: { description: '1 = experimental empty host command buffers, requires live_queue=1', default: '0' }
      live_queue: { description: '1 = experimental live host command queue, requires metal_single=1', default: '0' }
      live_texture: { description: '1 = limited guest-backed host texture experiment', default: '0' }
      live_buffer: { description: '1 = experimental live shared Metal buffer, requires metal_single=1', default: '0' }
      buffer_probe: { description: '1 = synthetic buffer probe, args = trace request sizes, both = both', default: '0' }
      oslog: { description: 'IVM_OSLOG: unslid _os_log_impl VA (libsystem_trace 180055c88) to print every guest os_log', default: '' }
      oslog_n: { description: 'IVM_OSLOG_N cap', default: '60000' }
      utrace_extra: { description: 'extra unslid VAs appended to IVM_UTRACE (abort/assert/terminate hooks)', default: '' }
      binaddrs: { description: 'comma-separated unslid dsc addresses to dump as code windows (CAM_BINADDRS)', default: '' }
permissions: { actions: read, contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false, persist-credentials: false }
      - name: Download pinned-build experimental parser runtime
        if: ${{ inputs.ffi_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: metal-ffi-runtime-linux-arm64
          path: metal-ffi
          run-id: '${{ inputs.ffi_run }}'
          github-token: '${{ github.token }}'
      - name: Optional kernel trap (s42, s43 brk)
        if: ${{ inputs.ktrace == '1' || inputs.ktrace == '2' }}
        run: |
          # 2 = s43: also trace _handle_breakpoint (BRK #n, EC 0x3c: Swift/PAC traps) with user pc+bt
          if [ "${{ inputs.ktrace }}" = "2" ]; then
            echo "IVM_KTRACE=fffffff007b569a0,fffffff007b57734,fffffff007b57de4" >> $GITHUB_ENV
          else
            echo "IVM_KTRACE=fffffff007b569a0,fffffff007b57734" >> $GITHUB_ENV
          fi
          echo "IVM_KTRACE_SAVE=fffffff007b569a0" >> $GITHUB_ENV
          echo "IVM_KTRACE_SS=1" >> $GITHUB_ENV
          echo "IVM_KTRACE_N=200" >> $GITHUB_ENV
      - name: Setup and run Photos test
        env:
          IVM_PAT: '${{ secrets.IVM_PAT }}'
          # CAM_PHOTOS lives INSIDE bench.py's CAM_TEST camera block (bench.py:434/483) — without
          # CAM_TEST=1 the Photos code never runs (run#15: perfect boot, zero photos_* fields).
          # CAM_SHOT populates the library so the grid has content; CAM_EDITCAM tests the editor.
          CAM_TEST: '1'
          CAM_IPS: '1'      # s46: bench commits the guest overlay into the root image before quit (ips-commit)
          CAM_PHOTOS: '1'
          CAM_SHOT: "${{ inputs.cam_shot }}"
          PHOTOS_VIA: "${{ inputs.photos_via }}"
          PHOTOS_LAUNCH: "${{ inputs.photos_launch }}"
          CAM_BINADDRS: "${{ inputs.binaddrs }}"
          # s41 experiment: phone-identical engine. Base 6541861f + the 4.0.52 patch list (ispstub = Camera icon/ISP),
          # plus the cameraEnv the phone uses (Inferno.kt cameraEnv). Without ispstub the Camera icon is missing.
          IVM_PATCHES: "${{ inputs.patches == 'none' && ' ' || inputs.patches }}"
          IVM_ISP: '1'
          IVM_ISP_LOG: '0'
          IVM_ISP_FEED_TEST: '2'
          IVM_ISP_FEED: '/opt/b/isp-feed.bin'
          BOOTARGS_ADD: 'camLoggingUsePrintf=1,camLogging=0xffffffff,camEnableAneIsp=0'
          IVM_SLIDEPC: 'fffffff007b1901c'
          IVM_LOCKFIX: '18bd24cd8,20,-4'
          IVM_USKIP: '1c2824adc/1d722c694,1c2824f84/1d722c694'
          IVM_ISP_STILLSET: '100'
          IVM_ISP_STILLFILL: '1'
          IVM_ISP_P0EVERY: '8'
          NINJA_J: '2'
          CC_OVERRIDE: '${{ inputs.cc }}'
          IVM_MESON: "${{ inputs.meson == '1' && '1' || '' }}"
          IVM_NRN_SAFE: '1'
          CAM_EDITCAM: '1'
          PHOTOS_WAIT: '90'   # s44: wait for ingestion before the icon launch
          RAM_GREP: '1'   # s44: grep guest RAM for IMG_/DCIM/Photos.sqlite after the shots
          # s42: phone-identical camera/Photos env (Inferno.kt PHOTO_USET + UTRACE). Without IVM_USET the shutter
          # never writes a photo (isp60: Camera asks for HEVC -> no still) and Photos has no thumbnails.
          IVM_USET: "${{ inputs.ivm_uset != '' && inputs.ivm_uset || '18bcf9b64:8=0,1c2918af0:0=1,1a8073be0:0=0,18c250eb0:0=1,18b9c08a4:8=1,18c25454c:1=3000000,19d2638d8:0=0/2,19d261b2c:32=19d261b34/23,19cd2f024:32=19cd2f028/20' }}"
          IVM_UTRACE: "${{ inputs.utrace_extra && format('1801953f0,{0}', inputs.utrace_extra) || '1801953f0' }}"
          IVM_UTRACE_BT: '1'
          IVM_THREAD: "${{ inputs.metal_single == '1' && 'single' || 'multi' }}"
          IVM_METAL_LIBRARY_PROBE: "${{ inputs.library_probe }}"
          IVM_METAL_LIVE_LIBRARY: "${{ inputs.live_library == 'probe' && '1' || inputs.live_library }}"
          IVM_METAL_CONSTANT_PROBE: "${{ inputs.live_library == 'probe' && '1' || '0' }}"
          IVM_METAL_FFI_PROBE_PATH: "${{ inputs.ffi_run != '' && format('{0}/metal-ffi/libivm_metal_ffi.so', github.workspace) || '' }}"
          IVM_METAL_LIMITS_DISCOVERY: "${{ inputs.limits_discovery }}"
          IVM_METAL_LIVE_TEXTURE: "${{ inputs.live_texture }}"
          IVM_METAL_LIVE_BUFFER: "${{ inputs.live_buffer }}"
          IVM_METAL_LIVE_QUEUE: "${{ inputs.live_queue }}"
          IVM_METAL_LIVE_COMMAND: "${{ inputs.live_command }}"
          IVM_METAL_BUFFER_PROBE: "${{ (inputs.buffer_probe == '1' || inputs.buffer_probe == 'both') && '1' || '0' }}"
          IVM_MARGS: "${{ (inputs.buffer_probe == 'args' || inputs.buffer_probe == 'both') && '1' || '0' }}"
          IVM_OSLOG: "${{ inputs.oslog }}"
          IVM_OSLOG_N: "${{ inputs.oslog_n || '60000' }}"
        run: |
          set -uxo pipefail
          R=$GITHUB_WORKSPACE; O=$R/bench-out; mkdir -p "$O" /opt/b /opt/vm
          which bash zstd tar jq || echo "Missing commands!"

          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git curl ca-certificates jq zstd python3 python3-venv ninja-build clang-18 pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev libzstd-dev libpng-dev libjpeg-dev nettle-dev libgmp-dev liblzfse-dev libtasn1-6-dev zlib1g-dev liblz4-dev cmake procps iproute2 python3-fsapfs
          # Inferno's meson.build hard-requires nettle >=3.10 (meson.build:1758) when --enable-nettle;
          # ubuntu-24.04-arm ships 3.9.1 (ios-boot-test only passes because trixie's container has 3.10.1).
          # Build 3.10.1 into /usr/local: same soname (libnettle.so.8), pkg-config prefers /usr/local.
          curl -fsSL https://ftpmirror.gnu.org/nettle/nettle-3.10.1.tar.gz | tar -xz -C /tmp
          cd /tmp/nettle-3.10.1 && ./configure --prefix=/usr/local --disable-documentation >nettle-conf.log && make -j"$(nproc)" >nettle-make.log && sudo make install >/dev/null && sudo ldconfig && cd "$R"
          echo "nettle now: $(pkg-config --modversion nettle)"
          pipx install meson==1.7.0 || pip3 install --user meson==1.7.0
          # Private release credentials are readable only by the runner and are
          # removed immediately after download, including on an interrupted step.
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/user/.tokens
          umask 077; printf %s "$IVM_PAT" > /home/user/.tokens/github.pat
          trap 'rm -f /home/user/.tokens/github.pat' EXIT
          # Download diskset
          bash $R/ivm-repo/ivm/inferno/gh-release.sh get "${{ inputs.diskset }}" /opt/dl > $O/download.log 2>&1
          rm -f /home/user/.tokens/github.pat; trap - EXIT
          unset IVM_PAT GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          zstd -dc /opt/dl/*.tar.zst | tar -C /opt/vm -xS && rm -rf /opt/dl
          VMD=$(dirname "$(ls /opt/vm/*/entry.json | head -1)"); echo "VM=$VMD"
          # s44 CoreData fix (see tools/photos_db_fix.py): in the setupdone base, Z_PRIMARYKEY.Z_MAX is 0 for the
          # GenericAlbum entities (26/31/32) while their rows go up to Z_PK 38. Photos' next insert collides
          # ("Constraint unique violation" -> optimistic locking failure) and the grid stays empty. Repair the
          # root disk on a read-write APFS mount (linux-apfs-rw v0.3.21) before the VM boots.
          ROOT_IMG=$(find "$VMD" -maxdepth 1 -name root -type f | head -1); echo "ROOT_IMG=$ROOT_IMG"
          if [ -n "$ROOT_IMG" ]; then
            sudo apt-get install -y -q linux-headers-$(uname -r) build-essential > $O/apfsrw-deps.log 2>&1 || sudo apt-get install -y -q linux-headers-generic build-essential >> $O/apfsrw-deps.log 2>&1 || true
            git clone -q --depth 1 -b v0.3.21 https://github.com/linux-apfs/linux-apfs-rw /tmp/apfsrw && make -C /tmp/apfsrw -j"$(nproc)" KDIR=/lib/modules/$(uname -r)/build > $O/apfsrw-build.log 2>&1
            sudo insmod /tmp/apfsrw/apfs.ko || echo "apfs insmod failed"
            LOOP=$(sudo losetup -f --show -o 24576 "$ROOT_IMG"); sudo mkdir -p /mnt/data
            if sudo mount -t apfs -o vol=1,readwrite "$LOOP" /mnt/data; then
              sudo python3 "$R/ivm-repo/ivm/lab/tools/photos_db_fix.py" /mnt/data/mobile/Media/PhotoData/Photos.sqlite | tee $O/photos-db-fix.txt
              sudo python3 "$R/ivm-repo/ivm/lab/tools/photos_sqldebug.py" /mnt/data | tee -a $O/photos-db-fix.txt
              # Option 1 test 2: drop UNIQUE indexes in knowledgeC.db (CoreDuet knowledge store): the base copy holds rows that CoreData inserts again
              # (KeyValue (DKSync3Coordinator, NeedsSiriCloudDelete), StructuredMetadata hash b1ff...). Each conflicting
              # save is a unique violation -> optimistic locking failure -> Photos/Camera abort. Keep a copy of the
              # base store for diagnosis, then remove it so CoreDuet creates an empty store on boot.
              sudo mkdir -p "$O/knowledge-base"; sudo sh -c 'cp /mnt/data/mobile/Library/CoreDuet/Knowledge/knowledgeC.db* "$1"/knowledge-base/' sh "$O" || true
              sudo python3 "$R/ivm-repo/ivm/lab/tools/knowledge_drop_unique.py" /mnt/data/mobile/Library/CoreDuet/Knowledge/knowledgeC.db | tee -a $O/photos-db-fix.txt || true
              sudo ls -la /mnt/data/mobile/Library/CoreDuet/Knowledge/ | tee -a $O/photos-db-fix.txt || true
              sync; sudo umount /mnt/data
            else
              echo "photos db fix: mount failed" | tee $O/photos-db-fix.txt
            fi
            sudo losetup -d "$LOOP" || true
          else
            echo "photos db fix: no root image under $VMD" | tee $O/photos-db-fix.txt
          fi
          if [ "${{ inputs.ktrace }}" = "3" ]; then
            # s43 kill trace: resolve kernel PCs from THIS run's kernelcache (BRK, data abort, exception_triage,
            # psignal_internal, memorystatus_do_kill, exit1). Prints export lines; eval sets IVM_KTRACE*.
            python3 -m venv /tmp/lzv && /tmp/lzv/bin/pip install -q lzfse
            eval "$(/tmp/lzv/bin/python3 "$R/ivm-repo/ivm/lab/tools/kernel-trap-pcs.py" "$VMD/kernelcache" "$O/ksym" | tee "$O/ksym-exports.txt")"
            cat $O/ksym/ksyms-pick.txt
          fi
          # Build engine (use pinned commit). set -e would skip the tail on failure, so guard it.
          if ! bash $R/ivm-repo/ivm/bench/build-x86.sh ${{ inputs.base }} /opt/b/eng > $O/build.log 2>&1; then
            echo "=== ENGINE BUILD FAILED, build.log tail ==="
            tail -80 $O/build.log
            exit 1
          fi
          tail -20 $O/build.log
          # Run Photos test
          QD=$(ls -d /opt/b/keymaps-* 2>/dev/null | head -1); [ -z "$QD" ] && QD=/tmp/qd && mkdir -p $QD
          # qemu_find_file(KEYMAP) looks for <datadir>/keymaps/en-us — -L needs the PARENT of
          # keymaps/ (same as ios-boot-test's /opt/qd wrap); a bare keymaps-<sha> dir exits at VNC open.
          mkdir -p /opt/qd && rm -rf /opt/qd/keymaps && cp -r "$QD" /opt/qd/keymaps
          if [ "$IVM_METAL_LIVE_LIBRARY" = 1 ] && [ -z "$IVM_METAL_FFI_PROBE_PATH" ]; then echo 'live library requires isolated parser runtime'; exit 1; fi
          if [ -n "$IVM_METAL_FFI_PROBE_PATH" ]; then
            # Translator code runs offline with no credential in its environment.
            # Keep loopback for QEMU monitor/VNC, then drop root before bench.
            test -r "$IVM_METAL_FFI_PROBE_PATH" && test "$IVM_METAL_LIBRARY_PROBE" = 1 || exit 1
            sudo --preserve-env unshare -n -- sh -c 'ip link set lo up; exec setpriv --reuid="$1" --regid="$2" --init-groups python3 -u "$3" /opt/b/eng /opt/qd "$4" "$5" photos-test 4 3G 512' sh "$(id -u)" "$(id -g)" "$R/ivm-repo/ivm/bench/bench.py" "$VMD" "$O" 2>&1 | tee $O/bench.log
          else
            CAM_PHOTOS=1 IVM_USET="$IVM_USET" python3 -u $R/ivm-repo/ivm/bench/bench.py /opt/b/eng /opt/qd "$VMD" "$O" "photos-test" "4" "3G" "512" 2>&1 | tee $O/bench.log
          fi
          echo "=== Photos results ==="
          grep -E "photos_grid_reached|photos_state|photos_launch_tries" $O/bench.log | tail -5
      - name: Summarize Metal diagnostic text (not a rendering verdict)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_WORKSPACE/ivm-repo/ivm/lab/tools/metal_trace_report.py"
          S="$GITHUB_WORKSPACE/bench-out/photos-test/serial.log"
          B="$GITHUB_WORKSPACE/bench-out/bench.log"
          if [ -f "$R" ] && [ -f "$S" ] && [ -f "$B" ]; then
            python3 "$R" "$S" --bench "$B" | tee "$GITHUB_WORKSPACE/bench-out/metal-trace-report.json"
          else
            echo 'Metal text report unavailable for this run/ref.'
          fi
      - name: Photos store check (guest DB committed to the root image)
        if: always()
        run: |
          D=${{ github.workspace }}/bench-out/photos-test/photos-live
          mkdir -p "$D"
          ls -la /opt/vm/iphone11 2>&1 | head -20
          ROOT_IMG=$(find /opt/vm -maxdepth 3 -name root -type f 2>/dev/null | head -1); echo "ROOT_IMG=$ROOT_IMG"
          if [ -n "$ROOT_IMG" ]; then
            python3 ${{ github.workspace }}/ivm-repo/ivm/lab/tools/photos_db_dump.py "$ROOT_IMG" 0x6000 "$D/dump" > "$D/dump.log" 2>&1 || true
            tail -40 "$D/dump.log"; cat "$D/dump/report.txt" 2>/dev/null || true
          else echo "no root image"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photos-test-results
          path: |
            ${{ github.workspace }}/bench-out/bench.log
            ${{ github.workspace }}/bench-out/metal-trace-report.json
            ${{ github.workspace }}/bench-out/**/serial.log
            ${{ github.workspace }}/bench-out/**/dscwin.*
            ${{ github.workspace }}/bench-out/build.log
            ${{ github.workspace }}/bench-out/photos-db-fix.txt
            ${{ github.workspace }}/bench-out/knowledge-base/**
            ${{ github.workspace }}/bench-out/**/dbcheck.txt
            ${{ github.workspace }}/bench-out/**/photos-live/**
            ${{ github.workspace }}/bench-out/**/ram-grep-*.txt
            ${{ github.workspace }}/bench-out/**/*.png
            ${{ github.workspace }}/bench-out/result.json
            ${{ github.workspace }}/bench-out/**/*.png
          if-no-files-found: warn
