name: photos-test
on:
  workflow_dispatch:
    inputs:
      ivm_uset: { description: 'IVM_USET value to test (empty for default)', default: '' }
      ivm_ref: { description: 'ivm repo ref', default: 'main' }
      diskset: { description: 'disk set release tag (diskset-<name>-18A5351d)', default: 'diskset-setupdone-18A5351d' }
      base: { description: 'Inferno commit to build', default: '6541861f4d033a0de327b5ccc5180ebac20bf461' }
      patches: { description: 'IVM_PATCHES list (empty = none)', default: 'ispstub ktrace' }
      cc: { description: 'gcc | clang', default: 'gcc' }
      meson: { description: '1 = phone meson option set (IVM_MESON)', default: '0' }
permissions: { actions: read, contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false }
      - name: Setup and run Photos test
        env:
          IVM_PAT: '${{ secrets.IVM_PAT }}'
          # CAM_PHOTOS lives INSIDE bench.py's CAM_TEST camera block (bench.py:434/483) — without
          # CAM_TEST=1 the Photos code never runs (run#15: perfect boot, zero photos_* fields).
          # CAM_SHOT populates the library so the grid has content; CAM_EDITCAM tests the editor.
          CAM_TEST: '1'
          CAM_PHOTOS: '1'
          CAM_SHOT: '1'
          # s41 experiment: phone-identical engine. Base 6541861f + the 4.0.52 patch list (ispstub = Camera icon/ISP),
          # plus the cameraEnv the phone uses (Inferno.kt cameraEnv). Without ispstub the Camera icon is missing.
          IVM_PATCHES: "${{ inputs.patches == 'none' && ' ' || inputs.patches }}"
          IVM_ISP: '1'
          IVM_ISP_LOG: '0'
          IVM_ISP_FEED_TEST: '2'
          IVM_ISP_FEED: '/opt/b/isp-feed.bin'
          BOOTARGS_ADD: 'camLoggingUsePrintf=1,camLogging=0xffffffff,camEnableAneIsp=0'
          IVM_SLIDEPC: 'fffffff007b1901c'
          IVM_LOCKFIX: '18bd24cd8,20,-4'
          IVM_USKIP: '1c2824adc/1d722c694,1c2824f84/1d722c694'
          IVM_ISP_STILLSET: '100'
          IVM_ISP_STILLFILL: '1'
          IVM_ISP_P0EVERY: '8'
          NINJA_J: '2'
          CC_OVERRIDE: '${{ inputs.cc }}'
          IVM_MESON: "${{ inputs.meson == '1' && '1' || '' }}"
          IVM_NRN_SAFE: '1'
          CAM_EDITCAM: '1'
          IVM_USET: '${{ inputs.ivm_uset }}'
        run: |
          set -uxo pipefail
          R=$GITHUB_WORKSPACE; O=$R/bench-out; mkdir -p "$O" /opt/b /opt/vm
          which bash zstd tar jq || echo "Missing commands!"

          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git curl ca-certificates jq zstd python3 python3-venv ninja-build clang-18 pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev libzstd-dev libpng-dev libjpeg-dev nettle-dev libgmp-dev liblzfse-dev libtasn1-6-dev zlib1g-dev liblz4-dev cmake procps
          # Inferno's meson.build hard-requires nettle >=3.10 (meson.build:1758) when --enable-nettle;
          # ubuntu-24.04-arm ships 3.9.1 (ios-boot-test only passes because trixie's container has 3.10.1).
          # Build 3.10.1 into /usr/local: same soname (libnettle.so.8), pkg-config prefers /usr/local.
          curl -fsSL https://ftpmirror.gnu.org/nettle/nettle-3.10.1.tar.gz | tar -xz -C /tmp
          cd /tmp/nettle-3.10.1 && ./configure --prefix=/usr/local --disable-documentation >nettle-conf.log && make -j"$(nproc)" >nettle-make.log && sudo make install >/dev/null && sudo ldconfig && cd "$R"
          echo "nettle now: $(pkg-config --modversion nettle)"
          pipx install meson==1.7.0 || pip3 install --user meson==1.7.0
          sudo mkdir -p /home/user/.tokens; printf %s "$IVM_PAT" | sudo tee /home/user/.tokens/github.pat > /dev/null; sudo chmod 644 /home/user/.tokens/github.pat
          # Download diskset
          bash $R/ivm-repo/ivm/inferno/gh-release.sh get "${{ inputs.diskset }}" /opt/dl > $O/download.log 2>&1
          zstd -dc /opt/dl/*.tar.zst | tar -C /opt/vm -xS && rm -rf /opt/dl
          VMD=$(dirname "$(ls /opt/vm/*/entry.json | head -1)"); echo "VM=$VMD"
          # Build engine (use pinned commit). set -e would skip the tail on failure, so guard it.
          if ! bash $R/ivm-repo/ivm/bench/build-x86.sh ${{ inputs.base }} /opt/b/eng > $O/build.log 2>&1; then
            echo "=== ENGINE BUILD FAILED, build.log tail ==="
            tail -80 $O/build.log
            exit 1
          fi
          tail -20 $O/build.log
          # Run Photos test
          QD=$(ls -d /opt/b/keymaps-* 2>/dev/null | head -1); [ -z "$QD" ] && QD=/tmp/qd && mkdir -p $QD
          # qemu_find_file(KEYMAP) looks for <datadir>/keymaps/en-us — -L needs the PARENT of
          # keymaps/ (same as ios-boot-test's /opt/qd wrap); a bare keymaps-<sha> dir exits at VNC open.
          mkdir -p /opt/qd && rm -rf /opt/qd/keymaps && cp -r "$QD" /opt/qd/keymaps
          CAM_PHOTOS=1 IVM_USET="$IVM_USET" python3 -u $R/ivm-repo/ivm/bench/bench.py /opt/b/eng /opt/qd "$VMD" "$O" "photos-test" "4" "3G" "512" 2>&1 | tee $O/bench.log
          echo "=== Photos results ==="
          grep -E "photos_grid_reached|photos_state|photos_launch_tries" $O/bench.log | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photos-test-results
          path: |
            ${{ github.workspace }}/bench-out/bench.log
            ${{ github.workspace }}/bench-out/build.log
            ${{ github.workspace }}/bench-out/result.json
            ${{ github.workspace }}/bench-out/**/*.png
          if-no-files-found: warn
