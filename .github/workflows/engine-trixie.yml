name: engine-trixie
# Diagnostic: build the pinned Inferno engine (6541861f, NO patches) with the SAME build-x86.sh that
# ios-boot-test used (its run 14 booted iOS in debian:trixie). Isolates the toolchain from our patch chain.
on:
  workflow_dispatch:
    inputs:
      commit: { description: 'Inferno commit', default: '6541861f4d033a0de327b5ccc5180ebac20bf461' }
      ivm_ref: { description: 'ivm repo ref', default: 'main' }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: build in debian:trixie (same container as ios-boot-test)
        env:
          IVM_PAT: '${{ secrets.IVM_PAT }}'
          COMMIT: '${{ inputs.commit }}'
          IVM_REF: '${{ inputs.ivm_ref }}'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm -e IVM_PAT -e COMMIT -e IVM_REF \
            -v "$GITHUB_WORKSPACE/out":/tmp/out debian:trixie bash -c '
              set -u
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential git curl ca-certificates jq zstd python3 python3-venv ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev libzstd-dev libpng-dev libjpeg-dev nettle-dev libgmp-dev liblzfse-dev libtasn1-6-dev libgnutls28-dev libbz2-dev cmake > /tmp/out/apt.log 2>&1 || { tail -40 /tmp/out/apt.log; exit 1; }
              gcc --version | head -1 | tee /tmp/out/toolchain.txt; meson --version | tee -a /tmp/out/toolchain.txt; nettle-config --version 2>/dev/null | tee -a /tmp/out/toolchain.txt || true
              git clone -q "https://x-access-token:${IVM_PAT}@github.com/sahib3636-arch/ivm.git" /tmp/ivm
              git -C /tmp/ivm checkout -q "$IVM_REF"; git -C /tmp/ivm log --oneline -1 | tee -a /tmp/out/toolchain.txt
              mkdir -p /opt/b
              bash /tmp/ivm/ivm/bench/build-x86.sh "$COMMIT" /opt/b/eng > /tmp/out/build.log 2>&1; rc=$?
              echo "build-x86 rc=$rc" | tee -a /tmp/out/toolchain.txt
              if [ $rc -ne 0 ]; then tail -60 /tmp/out/build.log; cp /opt/b/*/src/build/ninja.log /tmp/out/ 2>/dev/null; cp /opt/b/*/src/build/meson-logs/meson-log.txt /tmp/out/ 2>/dev/null; grep -m20 -B3 -A8 -E "error:|FAILED:" /tmp/out/ninja.log 2>/dev/null | head -60; fi
              exit $rc'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: engine-trixie-out, path: out/, if-no-files-found: ignore }
