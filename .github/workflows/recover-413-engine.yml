name: Recover 4.1.3 engine for benchmarks
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the exact 4.1.3 native artifact
        uses: actions/download-artifact@v4
        with:
          name: ivm-native
          run-id: 44894151967
          github-token: ${{ github.token }}
          path: ivm-repo/work/out
      - name: Verify historical APK engine digest
        run: |
          set -euo pipefail
          echo '89866a14cec04f80c16539613da956a0093d8d8f31ffd3e2f4f28f3d86085f01  ivm-repo/work/out/jniLibs/arm64-v8a/libinferno.so' | sha256sum --check
          test -f ivm-repo/work/out/assets/qemu-data/engine.json
          echo 'Recovered from apk run 44894151967 native artifact; SHA256 matched APK library.' > ivm-repo/native.log
      - name: Upload in explore engine layout
        uses: actions/upload-artifact@v4
        with:
          name: android-native-s50ship413
          path: |
            ivm-repo/work/out
            ivm-repo/native.log
          if-no-files-found: error
