name: metal-guest-symbols
# Read only system dyld cache symbol tables. No user photo traversal or export.
on:
  workflow_dispatch:
    inputs:
      scope: { description: 'allocation or iosurface system symbols', default: 'allocation' }
      ivm_ref: { description: 'ivm full SHA', default: 'exp/device-stub-20261027' }
permissions: { contents: read, actions: read }
jobs:
  symbols:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahib3636-arch/ivm
          token: '${{ secrets.IVM_PAT }}'
          ref: '${{ inputs.ivm_ref }}'
          path: ivm-repo
          lfs: false
          persist-credentials: false
      - name: Open system disk and inspect guest allocation symbols
        env:
          IVM_PAT: '${{ secrets.IVM_PAT }}'
          SYMBOL_SCOPE: '${{ inputs.scope }}'
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_WORKSPACE"; O="$R/guest-symbols"; mkdir -p "$O" /opt/dl /opt/vm
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq zstd >/dev/null 2>&1
          pip3 install -q --break-system-packages libfsapfs-python capstone
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/user/.tokens
          umask 077; printf %s "$IVM_PAT" > /home/user/.tokens/github.pat
          trap 'rm -f /home/user/.tokens/github.pat /tmp/ivm-system-dsc.bin' EXIT
          bash "$R/ivm-repo/ivm/inferno/gh-release.sh" get diskset-setupdone-18A5351d /opt/dl > "$O/download.log" 2>&1
          rm -f /home/user/.tokens/github.pat
          zstd -dc /opt/dl/*.tar.zst | tar -C /opt/vm -xS; rm -rf /opt/dl
          ROOT=$(find /opt/vm -maxdepth 3 -name root -type f | head -1); test -n "$ROOT"
          A="$R/ivm-repo/ivm/lab/cam/tools/apfs.py"
          python3 "$A" "$ROOT" 0x6000 0 ls /System/Library/Caches/com.apple.dyld > "$O/dsc-ls.txt"
          DSC=$(sort -k2 -n -r "$O/dsc-ls.txt" | awk '$1 ~ /dyld_shared_cache_arm64e$/ {print $1; exit}')
          test -n "$DSC"
          python3 "$A" "$ROOT" 0x6000 0 get "/System/Library/Caches/com.apple.dyld/$(basename "$DSC")" /tmp/ivm-system-dsc.bin
          case "$SYMBOL_SCOPE" in
            allocation)
              patterns=('^_malloc$' '^_calloc$' '^_free$' '^_malloc_size$' '^_class_getInstanceSize$' '^_class_createInstance$' '^_object_getClass$' '^_objc_retain$' '^_objc_release$' '^_objc_storeStrong$' '^_object_getIndexedIvars$' '^_object_dispose$' '^_objc_destructInstance$' '^_objc_rootRetainCount$' '^_objc_autorelease$' '^_objc_autoreleaseReturnValue$' '^_objc_retainAutoreleasedReturnValue$') ;;
            metal_limits)
              patterns=('(?i)(limits|capabilit|_MTLDevice|_MTLCreateSystemDefaultDevice)') ;;
            selector_lookup)
              patterns=('^_sel_registerName$' '^_objc_msgSend$' '^_objc_getClass$') ;;
            associations)
              patterns=('^_objc_setAssociatedObject$' '^_objc_getAssociatedObject$' '^_objc_removeAssociatedObjects$') ;;
            allocator_free)
              patterns=('^_(free.*|malloc_zone_free.*|szone_free.*|objc_destructInstance|object_dispose)$') ;;
            watchdog)
              # Diagnostic only: locate methods/classes before considering a scoped CI fixture-timeout experiment.
              patterns=('(?i)(FBSProcessWatchdog|FBApplicationProcessWatchdogPolicy|watchdogPolicyForProcess)') ;;
            blocks)
              patterns=('(?i)(Block_get_function_pointer|block_copy|block_release|block_invoke|client_callout)' '^_objc_retainBlock$' '^_dispatch_block_create$') ;;
            block_dispatch)
              patterns=('(?i)(ffi_call|dispatch.*callout|block.*invoke|invoke.*block|invokeWith.*target|perform.*block)') ;;
            camera_factory_callers)
              patterns=('^_MTLCreateSystemDefaultDevice$') ;;
            coreimage_helpers)
              patterns=('^_abort$') ;;
            coreimage_code)
              patterns=('^_abort$') ;;
            coreimage_class)
              patterns=('^_abort$') ;;
            coreimage_symbols)
              patterns=('.') ;;
            editor_code)
              patterns=('^_abort$') ;;
            editor_abort_range)
              patterns=('.') ;;
            fatal_signals)
              patterns=('^_abort$' '^___assert_rtn$' '^_raise$' '^_pthread_kill$' '^_objc_exception_throw$' '^_objc_terminate$' '^__os_crash$' '^___stack_chk_fail$') ;;
            guest_wait)
              patterns=('^_usleep$' '^_nanosleep$' '^_sched_yield$') ;;
            memory_copy)
              # Read only the pinned system cache; a returned symbol is not proof
              # that a guest pointer or IOSurface mapping is safe to touch.
              patterns=('(?i)(memcpy|memmove|memset|bcopy)' '^_class_getInstanceMethod$' '^_method_getImplementation$') ;;
            iosurface)
              patterns=('^_IOSurface.*$' '^_CF(Retain|Release)$') ;;
            *) echo "unsupported symbol scope" >&2; exit 2 ;;
          esac
          python3 "$R/ivm-repo/ivm/lab/tools/dsc-find.py" /tmp/ivm-system-dsc.bin "${patterns[@]}" > "$O/find.txt"
          if [ "$SYMBOL_SCOPE" = camera_factory_callers ]; then
            python3 "$R/ivm-repo/ivm/lab/tools/dsc-resolve.py" /tmp/ivm-system-dsc.bin 0x1a81eb1c8 0x1882493c4 0x185cd2a1c 0x1c27852a4 > "$O/find.txt"
            python3 "$R/ivm-repo/ivm/lab/tools/dsc-code-window.py" /tmp/ivm-system-dsc.bin 0x1a81eb1a0:0x80 0x188249390:0x80 0x185cd29e0:0x80 0x1c2785260:0xa0 >> "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = coreimage_helpers ]; then
            python3 "$R/ivm-repo/ivm/lab/tools/dsc-code-window.py" /tmp/ivm-system-dsc.bin 0x181d3f5b8:0x300 0x181d435c4:0x300 0x181d9ab30:0x300 > "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = coreimage_code ]; then
            python3 "$R/ivm-repo/ivm/lab/tools/dsc-code-window.py" /tmp/ivm-system-dsc.bin 0x181d0a100:0x400 0x181d0d698:0x1a0 0x181d0cf20:0x400 > "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = coreimage_class ]; then
            python3 "$R/ivm-repo/ivm/lab/tools/dsc-objc-inspect.py" /tmp/ivm-system-dsc.bin 0x1ddd31ce8 > "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = coreimage_symbols ]; then
            grep -E '/CoreImage.framework/CoreImage' "$O/find.txt" > "$O/coreimage.txt" || true
            mv "$O/coreimage.txt" "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = editor_code ]; then
            python3 "$R/ivm-repo/ivm/lab/tools/dsc-code-window.py" /tmp/ivm-system-dsc.bin 0x1b71ada00:0x700 0x1b7260700:0x600 0x1b725ed08:0x400 > "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = editor_abort_range ]; then
            grep -E '^0x1b7[0123]' "$O/find.txt" > "$O/range.txt" || true
            mv "$O/range.txt" "$O/find.txt"
          fi
          if [ "$SYMBOL_SCOPE" = metal_limits ]; then
            grep -E '/(Metal|IOGPU|AGXMetal)' "$O/find.txt" > "$O/metal.txt" || true
            mv "$O/metal.txt" "$O/find.txt"
          fi
          cat "$O/find.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-guest-symbols
          path: guest-symbols/find.txt
          if-no-files-found: warn
          retention-days: 7
