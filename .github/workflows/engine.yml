# Source of truth for ivm-ci/.github/workflows/engine.yml — build an Android engine VARIANT (compiler/PGO experiments).
# Artifact: android-native-<variant>  (work/out: jniLibs + qemu-data + debug/libinferno.so unstripped)
name: engine
on:
  workflow_dispatch:
    inputs:
      variant: { description: 'artifact suffix', required: true }
      commit: { default: '6541861f4d033a0de327b5ccc5180ebac20bf461' }
      cflags: { description: 'extra C flags', default: '' }
      ldflags: { description: 'extra link flags', default: '' }
      meson: { description: 'extra meson options', default: '' }
      patches: { description: 'space-separated ivm/inferno/patches/exp/<name>.py to apply', default: '' }
      pgo_art: { description: 'artifact with pgo/*.profraw to merge + -fprofile-use (empty = none)', default: '' }
      ivm_ref: { default: 'main' }
permissions: { actions: read, contents: read }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false }
      - name: host packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build python3-venv pkg-config cmake gcc && pipx install meson==1.7.0
      - name: PGO profile
        if: inputs.pgo_art != ''
        env: { GH_TOKEN: '${{ github.token }}', ART: '${{ inputs.pgo_art }}' }
        run: |
          set -euo pipefail
          # pgo_art accepts a comma-separated list. The old single-request form ("?name=A,B,C")
          # matches nothing because the API name filter is exact -> empty profile -> -fprofile-use
          # silently does nothing. Loop, and fail loudly if any name is missing.
          mkdir -p pgo
          IFS=',' read -ra NAMES <<< "$ART"
          total=0
          for raw in "${NAMES[@]}"; do
            name=$(echo "$raw" | xargs); [ -z "$name" ] && continue
            id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=1" | jq -r '.artifacts[0].id // empty')
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "::error::PGO artifact not found: $name"; exit 1; fi
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o "p_$name.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
            unzip -qo "p_$name.zip" -d pgo
            total=$(find pgo -name '*.profraw' | wc -l)
            echo "PGO artifact $name id=$id -> $total profraw files so far"
          done
          if [ "$total" -eq 0 ]; then echo "::error::no .profraw in PGO artifacts"; exit 1; fi
          find pgo -name '*.profraw' | head
          cd pgo
          # raw profiles are toolchain-version specific: merge with the SAME NDK the build uses (build script: ANDROID_NDK_HOME first)
          PD=${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-profdata; $PD --version | head -2
          $PD merge -o "$GITHUB_WORKSPACE/ivm.profdata" $(find . -name '*.profraw')
          ls -la "$GITHUB_WORKSPACE/ivm.profdata"
          echo "IVM_PROFDATA=$GITHUB_WORKSPACE/ivm.profdata" >> "$GITHUB_ENV"
      - name: cross-build
        working-directory: ivm-repo
        env: { INFERNO_COMMIT: '${{ inputs.commit }}', IVM_OPT_CFLAGS: '${{ inputs.cflags }}', IVM_LDFLAGS: '${{ inputs.ldflags }}', IVM_MESON_EXTRA: '${{ inputs.meson }}', IVM_PATCHES: '${{ inputs.patches }}' }
        run: bash ivm/android/ci/build-inferno-android.sh 2>&1 | tee native.log; test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-${{ inputs.variant }}
          path: |
            ivm-repo/work/out
            ivm-repo/native.log
