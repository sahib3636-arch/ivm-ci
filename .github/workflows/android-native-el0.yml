name: android-native-el0
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'iVM full commit SHA', required: true }
permissions: { contents: read }
jobs:
  android-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, persist-credentials: false, lfs: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build isolated Android probe (x86 emulator and ARM phone binaries)
        run: |
          set -euo pipefail
          TC="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ROOT=ivm-repo/ivm/lab/native_el0_android/harness
          SRC=ivm-repo/ivm/bench/micro/native-el0/probe.c
          for arch in x86_64 arm64-v8a; do
            mkdir -p "$ROOT/app/src/main/jniLibs/$arch"
            if [ "$arch" = x86_64 ]; then C="$TC/x86_64-linux-android34-clang"; else C="$TC/aarch64-linux-android34-clang"; fi
            "$C" -std=gnu11 -Wall -Wextra -Werror -fPIC -Dmain=ivm_native_probe_main -c "$SRC" -o probe-$arch.o
            "$C" -std=gnu11 -Wall -Wextra -Werror -fPIC -shared probe-$arch.o "$ROOT/jni.c" -o "$ROOT/app/src/main/jniLibs/$arch/libivm_native_probe.so"
          done
          "$TC/aarch64-linux-android34-clang" -std=gnu11 -O2 -Wall -Wextra -Werror "$SRC" -o "$GITHUB_WORKSPACE/native-arm64"
          (cd "$GITHUB_WORKSPACE" && sha256sum native-arm64 > native-arm64.sha256)
          cd "$ROOT"; gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx2g :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: native-android-arm64-executable, path: 'native-arm64*', retention-days: 7 }
      - name: Allow KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probe in Android emulator app sandbox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install "$GITHUB_WORKSPACE/ivm-repo/ivm/lab/native_el0_android/harness/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am instrument -w -r dev.ivm.nativeprobe/.Probe 2>&1 | tee native-probe.log
            grep -q 'IVM_NATIVE_PROBE_RESULT=0' native-probe.log
            grep -q 'INSTRUMENTATION_CODE: -1' native-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-native-el0-log, path: native-probe.log, if-no-files-found: warn, retention-days: 7 }
  arm-bionic:
    needs: android-probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with: { name: native-android-arm64-executable, path: binaries }
      - name: Run AArch64 Android-bionic executable on ARM Linux
        run: |
          set -euo pipefail
          (cd binaries && sha256sum -c native-arm64.sha256)
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl
          ROOT="$RUNNER_TEMP/android-root"; mkdir -p "$ROOT"
          TK=$(curl -fsS 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:redroid/redroid:pull' | jq -r .token)
          L=$(curl -fsS -H "Authorization: Bearer $TK" -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            'https://registry-1.docker.io/v2/redroid/redroid/manifests/sha256:d9ef29d08c5e7ff6d4771a9894d4df47725d9a733dc251c47bc40782cc86359a' | jq -er '.layers[0].digest')
          curl -fsSL -H "Authorization: Bearer $TK" "https://registry-1.docker.io/v2/redroid/redroid/blobs/$L" \
            | sudo tar xz -C "$ROOT" --wildcards 'system/bin/linker64' 'system/lib64/*' 'system/apex/com.android.runtime*'
          sudo mkdir -p "$ROOT/apex"
          sudo mv "$ROOT/system/apex/com.android.runtime" "$ROOT/apex/"
          sudo cp binaries/native-arm64 "$ROOT/probe"; sudo chmod 755 "$ROOT/probe"
          sudo chroot --userspec=2000:2000 "$ROOT" /system/bin/linker64 /probe | tee arm-bionic.log
          grep -q 'PASS host-native mapping, SIGSYS trap, shared alias and permission fault' arm-bionic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-arm-bionic-log, path: arm-bionic.log, if-no-files-found: warn, retention-days: 7 }
