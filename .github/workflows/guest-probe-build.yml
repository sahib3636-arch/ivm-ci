name: guest-probe-build
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'Full iVM commit', required: true }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false, persist-credentials: false }
      - name: Cross-compile and validate disposable iOS marker
        env: { CC: clang }
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang lld python3
          D=ivm-repo/ivm/lab/guest_probe
          (cd "$D" && python3 -m unittest -v test_prepare)
          mkdir -p guest-probe-artifact
          clang -target arm64-apple-ios14.0 -ffreestanding -Wall -Wextra -Werror -O2 -c "$D/marker.c" -o guest-probe-artifact/marker.o
          ld64.lld -arch arm64 -platform_version ios 14.0 14.0 -e _main -adhoc_codesign -o guest-probe-artifact/ivm-guest-probe guest-probe-artifact/marker.o "$D/libSystem.tbd"
          python3 - "$D" guest-probe-artifact/ivm-guest-probe <<'PY'
          import sys
          sys.path.insert(0,sys.argv[1]);from prepare import signed_hash
          print('verified helper CodeDirectory cdhash:',signed_hash(sys.argv[2]).hex())
          PY
          rm guest-probe-artifact/marker.o
      - uses: actions/upload-artifact@v4
        with: { name: guest-probe-marker, path: guest-probe-artifact/ivm-guest-probe, retention-days: 3 }
