name: guest-storage-boot
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'Full iVM commit', required: true }
      marker_run: { description: 'Guest marker build run ID', required: true }
      tcg_mode: { description: 'TCG mode: single or multi', default: 'single' }
permissions: { contents: read, actions: read }
jobs:
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: guest-storage-marker, path: guest-marker, run-id: '${{ inputs.marker_run }}', github-token: '${{ github.token }}' }
      - name: Prepare disposable guest disk and boot marker
        shell: bash
        env:
          IVM_PAT: '${{ secrets.IVM_PAT }}'
          CC_OVERRIDE: clang
          CC: clang
          CXX: clang++
          IVM_PATCHES: 'panelhz fpslog adpdirty ucdyn ispstub ktrace shmfb paneladapt usb-ncm-net shmaudio'
          IVM_NRN_SAFE: '1'
          IVM_THREAD: '${{ inputs.tcg_mode }}'
          IVM_SLIDEPC: 'fffffff007b1901c'
          IVM_UTRACE: '180255b48,180255d18'
          IVM_GUEST_SPAWN_PROBE: '1'
          IVM_GUEST_IO_WAIT: '1' 
          NINJA_J: '2'
        run: |
          set -euo pipefail
          R="$GITHUB_WORKSPACE"; O="$R/guest-marker-out"; mkdir -p "$O" /opt/b /opt/vm /opt/dl
          case "$IVM_THREAD" in single|multi) ;; *) echo 'invalid TCG mode' >&2; exit 1;; esac
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 build-essential git curl ca-certificates jq zstd python3 python3-venv ninja-build clang-18 pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev libzstd-dev libpng-dev libjpeg-dev nettle-dev libgmp-dev liblzfse-dev libtasn1-6-dev zlib1g-dev liblz4-dev cmake procps linux-headers-$(uname -r)
          if ! curl -fsSL --retry 4 --retry-all-errors -o /tmp/nettle.tgz https://ftpmirror.gnu.org/nettle/nettle-3.10.1.tar.gz || ! tar -tzf /tmp/nettle.tgz >/dev/null; then
            curl -fsSL --retry 4 --retry-all-errors -o /tmp/nettle.tgz https://ftp.gnu.org/gnu/nettle/nettle-3.10.1.tar.gz
            tar -tzf /tmp/nettle.tgz >/dev/null
          fi
          tar -xzf /tmp/nettle.tgz -C /tmp
          (cd /tmp/nettle-3.10.1 && ./configure --prefix=/usr/local --disable-documentation > "$O/nettle.log" && make -j2 >> "$O/nettle.log" && sudo make install >/dev/null)
          sudo ldconfig; pipx install meson==1.7.0 || pip3 install --user meson==1.7.0
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/user/.tokens
          umask 077; printf %s "$IVM_PAT" > /home/user/.tokens/github.pat
          trap 'rm -f /home/user/.tokens/github.pat' EXIT
          bash "$R/ivm-repo/ivm/inferno/gh-release.sh" get diskset-setupdone-18A5351d /opt/dl > "$O/download.log" 2>&1
          rm -f /home/user/.tokens/github.pat; trap - EXIT
          unset IVM_PAT GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          zstd -dc /opt/dl/*.tar.zst | tar -C /opt/vm -xS; rm -rf /opt/dl
          VMD=$(dirname "$(find /opt/vm -maxdepth 3 -name entry.json -type f | head -1)")
          test -f "$VMD/root" && test -f "$VMD/trustcache"
          git clone -q --depth 1 -b v0.3.21 https://github.com/linux-apfs/linux-apfs-rw /tmp/apfsrw
          make -C /tmp/apfsrw -j2 KDIR=/lib/modules/$(uname -r)/build > "$O/apfs-build.log" 2>&1
          sudo insmod /tmp/apfsrw/apfs.ko
          LOOP=$(sudo losetup -f --show -o 24576 "$VMD/root")
          cleanup() { sudo umount /mnt/ivm-guest-marker 2>/dev/null || true; sudo losetup -d "$LOOP" || true; }
          trap cleanup EXIT
          sudo mkdir -p /mnt/ivm-guest-marker
          sudo mount -t apfs -o vol=0,readwrite "$LOOP" /mnt/ivm-guest-marker
          sudo python3 "$R/ivm-repo/ivm/lab/guest_probe/prepare.py" system-replace-test-slot /mnt/ivm-guest-marker "$R/guest-marker/ivm-guest-probe" | tee -a "$O/prepare.log"
          sync; sudo umount /mnt/ivm-guest-marker
          sudo mount -t apfs -o vol=0,ro "$LOOP" /mnt/ivm-guest-marker
          sudo python3 - <<'PYVERIFY'
          import plistlib
          with open('/mnt/ivm-guest-marker/System/Library/xpc/launchd.plist','rb') as f:d=plistlib.load(f)
          key='/System/Library/LaunchDaemons/com.apple.DumpPanic.plist'
          job=d['LaunchDaemons'][key]
          print('Persisted disposable launchd replacement:',job.get('Program'))
          assert job.get('Program')=='/usr/libexec/ivm-guest-probe' 
          PYVERIFY
          sudo cmp "$R/guest-marker/ivm-guest-probe" /mnt/ivm-guest-marker/usr/libexec/ivm-guest-probe
          sudo ls -l /mnt/ivm-guest-marker/usr/libexec/ivm-guest-probe
          sudo umount /mnt/ivm-guest-marker
          sudo losetup -d "$LOOP"; trap - EXIT
          python3 - "$VMD/trustcache" <<'PYTRUST'
          import struct,sys
          d=open(sys.argv[1],'rb').read()
          print('trustcache size',len(d),'prefix',d[:32].hex(),'count@20',struct.unpack_from('<I',d,20)[0] if len(d)>=24 else None)
          PYTRUST
          python3 "$R/ivm-repo/ivm/lab/guest_probe/prepare.py" trust "$R/guest-marker/ivm-guest-probe" "$VMD/trustcache" | tee -a "$O/prepare.log"
          if ! bash "$R/ivm-repo/ivm/bench/build-x86.sh" 6541861f4d033a0de327b5ccc5180ebac20bf461 /opt/b/eng > "$O/build.log" 2>&1; then tail -80 "$O/build.log"; exit 1; fi
          QD=$(ls -d /opt/b/keymaps-* | head -1); mkdir -p /opt/qd; cp -r "$QD" /opt/qd/keymaps
          truncate -s $((4096 + 828 * 1792 * 4)) "$O/shmfb.bin"
          truncate -s $((64 + 65536)) "$O/shmaudio.bin"
          export IVM_SHM_FB_PATH="$O/shmfb.bin"
          export IVM_SHM_AUDIO_PATH="$O/shmaudio.bin"
          export MACHINE_EXTRA="usb-uplink-type=net,usb-uplink-addr=n0"
          export QEMU_EXTRA="-netdev|user,id=n0|-audiodev|none,id=snd0"
          cat > /tmp/ivm-echo.py <<'PYECHO'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 18080))
          s.listen(8)
          while True:
              c, _ = s.accept()
              d = c.recv(256)
              if b"IVM_NET_PING" in d:
                  c.sendall(b"IVM_NET_PONG_2026\n")
              c.close()
          PYECHO
          sed -i 's/^          //' /tmp/ivm-echo.py
          sudo --preserve-env unshare -n -- sh -c '
            ip link set lo up
            python3 -u /tmp/ivm-echo.py &
            SRV_PID=$!
            trap "kill $SRV_PID 2>/dev/null || true" EXIT
            setpriv --reuid="$1" --regid="$2" --init-groups python3 -u "$3" /opt/b/eng /opt/qd "$4" "$5" guest-marker 4 3G 512
          ' sh "$(id -u)" "$(id -g)" "$R/ivm-repo/ivm/bench/bench.py" "$VMD" "$O" 2>&1 | tee "$O/bench.log"
          python3 "$R/ivm-repo/ivm/bench/shm_frame_png.py" "$O/shmfb.bin" "$O/guest-marker/shmfb-final.png" | tee "$O/shmfb-summary.txt"
          cat > /tmp/ivm-shm-check.py <<'PYSHM'
          import struct, sys
          fb = open(sys.argv[1], "rb").read(64)
          f_magic, f_ver, f_w, f_h, f_stride, f_off, f_flags, f_bounds = struct.unpack_from("<8I", fb, 0)
          f_seq, f_dirty = struct.unpack_from("<QQ", fb, 32)
          print(f"SHMFB_CHECK magic={f_magic:#x} seq={f_seq} even={(f_seq & 1) == 0} dirty_px={f_dirty} bounds={f_bounds:#x}")
          assert f_magic == 0x494D5646 and f_seq >= 2 and (f_seq & 1) == 0 and f_dirty > 0
          au = open(sys.argv[2], "rb").read(64)
          a_magic, a_ver, a_rate, a_ch, a_bits, a_off, a_ring, a_act = struct.unpack_from("<8I", au, 0)
          a_wb, a_nz = struct.unpack_from("<QQ", au, 32)
          print(f"SHMAUDIO_CHECK magic={a_magic:#x} rate={a_rate} ch={a_ch} bits={a_bits} active={a_act} write_bytes={a_wb} nonzero_frames={a_nz}")
          assert a_magic == 0x414D5649 and a_rate == 48000 and a_ch == 2 and a_bits == 16
          PYSHM
          sed -i 's/^          //' /tmp/ivm-shm-check.py
          python3 /tmp/ivm-shm-check.py "$O/shmfb.bin" "$O/shmaudio.bin" | tee -a "$O/shmfb-summary.txt"
          grep -q 'IVM_GUEST_IO_START' "$O/guest-marker/serial.log"
          grep -q 'IVM_GUEST_IO_DONE' "$O/guest-marker/serial.log"
          grep -q 'IVM_GUEST_PERIPHERALS_DONE' "$O/guest-marker/serial.log"
          grep -q 'IVM_GUEST_NETWORK_RESULT=0' "$O/guest-marker/serial.log"
          grep -q 'IVM_GUEST_NETWORK_TCP_ROUNDTRIP=1' "$O/guest-marker/serial.log"
          test "$(grep -c 'IVM_GUEST_IO_PASS' "$O/guest-marker/serial.log")" -ge 4
          echo 'PASS: disposable guest storage, USB CDC-NCM TCP roundtrip, shmfb seqlock, and shmaudio ring verified' 
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-storage-boot-results
          path: |
            guest-marker-out/bench.log
            guest-marker-out/prepare.log
            guest-marker-out/build.log
            guest-marker-out/apfs-build.log
            guest-marker-out/shmfb-summary.txt
            guest-marker-out/guest-marker/serial.log
            guest-marker-out/guest-marker/*.png
          if-no-files-found: warn
          retention-days: 7
