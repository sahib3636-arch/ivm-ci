name: metal-runtime-android-emulator
# x86_64 emulator software path only; no phone/Adreno claim.
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'ivm full SHA', required: true }
permissions: { contents: read }
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahib3636-arch/ivm
          token: '${{ secrets.IVM_PAT }}'
          ref: '${{ inputs.ivm_ref }}'
          path: ivm-repo
          persist-credentials: false
          lfs: false
      - name: Fetch pinned public translator
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout --depth=1 https://github.com/steelbrain/metal2vulkan.git m2v
          cd m2v
          git fetch --quiet --depth=1 origin 219f01365dc4c8eb346816c405b5b17403793764
          git sparse-checkout init --no-cone
          printf '%s\n' '/Cargo.toml' '/rust-toolchain.toml' '/README.md' '/crates/metal2vulkan/Cargo.toml' '/crates/metal2vulkan/build.rs' '/crates/metal2vulkan/build_support.rs' '/crates/metal2vulkan/src/' '/crates/metal2vulkan-air/Cargo.toml' '/crates/metal2vulkan-air/src/' '/crates/metal2vulkan-devtools/Cargo.toml' '/crates/metal2vulkan-devtools/src/' '/crates/metal2vulkan-runtime/Cargo.toml' '/crates/metal2vulkan-runtime/src/' | git sparse-checkout set --no-cone --stdin
          git checkout --detach 219f01365dc4c8eb346816c405b5b17403793764
          cp -a ../ivm-repo/ivm/lab/metal_ffi crates/ivm_metal_ffi
          cp ../ivm-repo/ivm/lab/metal_ffi_runtime/runtime_ext.rs crates/ivm_metal_ffi/src/runtime_ext.rs
          printf '\nmod runtime_ext;\n' >> crates/ivm_metal_ffi/src/lib.rs
          printf '\nmetal2vulkan-runtime = { path = "../metal2vulkan-runtime" }\n' >> crates/ivm_metal_ffi/Cargo.toml
          python3 - <<'PY'
          p='Cargo.toml';s=open(p).read()
          for m in ('metal2vulkan-conformance','metal2vulkan-validation'):
              s=s.replace('    "crates/'+m+'",\n','')
          s=s.replace('members = [', 'members = [\n    "crates/ivm_metal_ffi",',1)
          open(p,'w').write(s)
          PY
      - name: Cross-build Android x86_64 with NDK clang
        shell: bash
        run: |
          set -euo pipefail
          NDK=${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 x86_64-linux-android
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android34-clang"
          export CC_x86_64_linux_android="$TC/x86_64-linux-android34-clang"
          cd m2v
          cargo +1.98.1 build -p ivm-metal-ffi --target x86_64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/emulator-runtime"
          cp target/x86_64-linux-android/debug/libivm_metal_ffi.so "$GITHUB_WORKSPACE/emulator-runtime/"
          "$TC/x86_64-linux-android34-clang" -std=c11 -Wall -Wextra -Werror \
            -Icrates/ivm_metal_ffi -I../ivm-repo/ivm/lab/metal_ffi_runtime \
            ../ivm-repo/ivm/lab/metal_ffi_runtime/test_device_selection.c \
            -L"$GITHUB_WORKSPACE/emulator-runtime" -livm_metal_ffi -o "$GITHUB_WORKSPACE/emulator-runtime/test_device_selection"
          "$TC/x86_64-linux-android34-clang" -std=c11 -Wall -Wextra -Werror \
            ../ivm-repo/ivm/lab/metal_ffi_runtime/vulkan_inventory.c -lvulkan -o "$GITHUB_WORKSPACE/emulator-runtime/vulkan_inventory"
          "$TC/x86_64-linux-android34-clang" -std=c11 -Wall -Wextra -Werror -DIVM_QEMU_METAL_BRIDGE=1 -DIVML_NO_STATIC_BACKEND \
            -I../ivm-repo/ivm/lab/metal_ffi -I../ivm-repo/ivm/lab/metal_ffi_runtime \
            ../ivm-repo/ivm/lab/metal_cpu/test_qemu_runtime_plugin.c \
            ../ivm-repo/ivm/lab/metal_ffi/library_bridge.c ../ivm-repo/ivm/lab/metal_ffi_runtime/runtime_bridge.c \
            -ldl -o "$GITHUB_WORKSPACE/emulator-runtime/test_qemu_runtime_plugin"
          "$TC/x86_64-linux-android34-clang" -std=c11 -Wall -Wextra -Werror \
            -Icrates/ivm_metal_ffi -I../ivm-repo/ivm/lab/metal_ffi_runtime \
            ../ivm-repo/ivm/lab/metal_ffi_runtime/test_runtime_pipeline.c \
            ../ivm-repo/ivm/lab/metal_ffi_runtime/runtime_bridge.c \
            -L"$GITHUB_WORKSPACE/emulator-runtime" -livm_metal_ffi -o "$GITHUB_WORKSPACE/emulator-runtime/test_runtime_pipeline"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build CI-only dynamic bridge sandbox app
        shell: bash
        run: |
          set -euo pipefail
          TC="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ROOT=ivm-repo/ivm/lab/metal_cpu/android_harness
          mkdir -p "$ROOT/app/src/main/jniLibs/x86_64"
          cp emulator-runtime/libivm_metal_ffi.so "$ROOT/app/src/main/jniLibs/x86_64/"
          "$TC/llvm-strip" --strip-debug "$ROOT/app/src/main/jniLibs/x86_64/libivm_metal_ffi.so"
          C="$TC/x86_64-linux-android34-clang"
          FLAGS="-std=c11 -Wall -Wextra -Werror -fPIC -D_POSIX_C_SOURCE=200809L -Iivm-repo/ivm/lab/metal_ffi -Iivm-repo/ivm/lab/metal_ffi_runtime"
          $C $FLAGS -DIVM_QEMU_METAL_BRIDGE=1 -DIVML_NO_STATIC_BACKEND -Dmain=ivm_dynamic_probe_main -c ivm-repo/ivm/lab/metal_cpu/test_qemu_runtime_plugin.c -o dynamic-test.o
          $C $FLAGS -Dmain=ivm_shader_probe_main -c ivm-repo/ivm/lab/metal_ffi_runtime/test_runtime_pipeline.c -o shader-test.o
          $C $FLAGS -shared dynamic-test.o shader-test.o ivm-repo/ivm/lab/metal_ffi/library_bridge.c \
            ivm-repo/ivm/lab/metal_ffi_runtime/runtime_bridge.c "$ROOT/jni.c" -ldl \
            -Lemulator-runtime -livm_metal_ffi -o "$ROOT/app/src/main/jniLibs/x86_64/libivm_dynamic_probe.so"
          cd "$ROOT"
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx2g :app:assembleDebug
      - name: Download system-shader scan for private CI use
        uses: actions/download-artifact@v4
        with:
          name: photos-metallib-scan-results
          path: system-shaders
          run-id: '41013651124'
          github-token: '${{ github.token }}'
      - name: Allow KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android emulator software Vulkan smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb shell getprop ro.build.fingerprint | tee "$GITHUB_WORKSPACE/emulator-fingerprint.txt"
            adb shell mkdir -p /data/local/tmp/ivm-metal
            adb push "$GITHUB_WORKSPACE/emulator-runtime/libivm_metal_ffi.so" /data/local/tmp/ivm-metal/
            adb push "$GITHUB_WORKSPACE/emulator-runtime/test_device_selection" /data/local/tmp/ivm-metal/
            adb push "$GITHUB_WORKSPACE/emulator-runtime/test_qemu_runtime_plugin" /data/local/tmp/ivm-metal/
            adb shell chmod 755 /data/local/tmp/ivm-metal/test_qemu_runtime_plugin
            adb shell 'cd /data/local/tmp/ivm-metal && LD_LIBRARY_PATH=. XDG_CACHE_HOME=/data/local/tmp/ivm-metal ./test_qemu_runtime_plugin /data/local/tmp/ivm-metal/libivm_metal_ffi.so' 2>&1 | tee "$GITHUB_WORKSPACE/emulator-dynamic-surface.log"
            grep -q 'PASS: dynamically loaded runtime with logical guest-surface clear and failure recovery' "$GITHUB_WORKSPACE/emulator-dynamic-surface.log"
            adb install -r "$GITHUB_WORKSPACE/ivm-repo/ivm/lab/metal_cpu/android_harness/app/build/outputs/apk/debug/app-debug.apk"
            adb push "$(find "$GITHUB_WORKSPACE/system-shaders" -maxdepth 1 -name '*.metallib' -type f | head -1)" /data/local/tmp/ivm-ci-shader.metallib
            adb shell "run-as dev.ivm.dynamicprobe sh -c 'mkdir -p files; cat /data/local/tmp/ivm-ci-shader.metallib > files/shader.metallib'"
            adb shell rm /data/local/tmp/ivm-ci-shader.metallib
            adb shell am instrument -r -w dev.ivm.dynamicprobe/.Probe 2>&1 | tee "$GITHUB_WORKSPACE/emulator-dynamic-sandbox.log"
            grep -q 'IVM_DYNAMIC_SANDBOX_RESULT=0' "$GITHUB_WORKSPACE/emulator-dynamic-sandbox.log"
            grep -q 'IVM_SHADER_SANDBOX_RESULT=0' "$GITHUB_WORKSPACE/emulator-dynamic-sandbox.log"
            grep -q 'INSTRUMENTATION_CODE: -1' "$GITHUB_WORKSPACE/emulator-dynamic-sandbox.log"
            adb push "$GITHUB_WORKSPACE/emulator-runtime/vulkan_inventory" /data/local/tmp/ivm-metal/
            adb shell chmod 755 /data/local/tmp/ivm-metal/vulkan_inventory
            adb shell /data/local/tmp/ivm-metal/vulkan_inventory 2>&1 | tee "$GITHUB_WORKSPACE/emulator-inventory.log"
            adb push "$GITHUB_WORKSPACE/emulator-runtime/test_runtime_pipeline" /data/local/tmp/ivm-metal/
            adb shell chmod 755 /data/local/tmp/ivm-metal/test_runtime_pipeline
            adb push "$(find "$GITHUB_WORKSPACE/system-shaders" -maxdepth 1 -name '*.metallib' -type f | head -1)" /data/local/tmp/ivm-metal/shader.metallib
            adb shell chmod 755 /data/local/tmp/ivm-metal/test_device_selection
            adb shell 'cd /data/local/tmp/ivm-metal && LD_LIBRARY_PATH=. XDG_CACHE_HOME=/data/local/tmp/ivm-metal ./test_device_selection --cpu-only' 2>&1 | tee "$GITHUB_WORKSPACE/emulator-vulkan.log"
            grep -q 'CPU ICD selected; hardware fallback correctly refused; clear/readback passed' "$GITHUB_WORKSPACE/emulator-vulkan.log"
            adb shell 'cd /data/local/tmp/ivm-metal && LD_LIBRARY_PATH=. XDG_CACHE_HOME=/data/local/tmp/ivm-metal ./test_runtime_pipeline shader.metallib' 2>&1 | tee "$GITHUB_WORKSPACE/emulator-shader.log"
            grep -q 'runtime shader draw pixels passed' "$GITHUB_WORKSPACE/emulator-shader.log"
            grep -q 'PASS: CPU Vulkan Metal-shaped pipeline with synthetic inputs' "$GITHUB_WORKSPACE/emulator-shader.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-runtime-android-emulator-results
          path: |
            emulator-fingerprint.txt
            emulator-vulkan.log
            emulator-inventory.log
            emulator-shader.log
            emulator-dynamic-surface.log
            emulator-dynamic-sandbox.log
          if-no-files-found: warn
          retention-days: 7
