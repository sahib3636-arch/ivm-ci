name: metal-library-ffi
# Real library parser via pinned public translator. System shader input only;
# no Photos user media. This is not a guest integration or rendering test.
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'ivm full SHA', required: true }
      scan_run: { description: 'system metallib scan run', default: '41013651124' }
permissions: { contents: read, actions: read }
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahib3636-arch/ivm
          token: '${{ secrets.IVM_PAT }}'
          ref: '${{ inputs.ivm_ref }}'
          path: ivm-repo
          persist-credentials: false
          lfs: false
      - name: Fetch pinned public translator source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout --depth=1 https://github.com/steelbrain/metal2vulkan.git m2v
          cd m2v
          git fetch --quiet --depth=1 origin 219f01365dc4c8eb346816c405b5b17403793764
          git sparse-checkout init --no-cone
          printf '%s\n' '/Cargo.toml' '/rust-toolchain.toml' '/README.md' '/crates/metal2vulkan/Cargo.toml' '/crates/metal2vulkan/build.rs' '/crates/metal2vulkan/build_support.rs' '/crates/metal2vulkan/src/' '/crates/metal2vulkan-air/Cargo.toml' '/crates/metal2vulkan-air/src/' '/crates/metal2vulkan-devtools/Cargo.toml' '/crates/metal2vulkan-devtools/src/' '/crates/metal2vulkan-validation/profiles/gate-lavapipe.json' | git sparse-checkout set --no-cone --stdin
          git checkout --detach 219f01365dc4c8eb346816c405b5b17403793764
          cp -a ../ivm-repo/ivm/lab/metal_ffi crates/ivm_metal_ffi
          python3 - <<'PY'
          p='Cargo.toml'
          s=open(p).read()
          for m in ('metal2vulkan-conformance','metal2vulkan-runtime','metal2vulkan-validation'):
              s=s.replace('    "crates/'+m+'",\n','')
          s=s.replace('members = [', 'members = [\n    "crates/ivm_metal_ffi",', 1)
          open(p,'w').write(s)
          PY
      - name: Build wrapper and C ABI test using clang
        shell: bash
        env: { CC: clang, CXX: clang++ }
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cd m2v
          cargo +1.98.1 build -p ivm-metal-ffi
          clang -std=c11 -Wall -Wextra -Werror crates/ivm_metal_ffi/test_library.c target/debug/libivm_metal_ffi.a -ldl -lpthread -lm -o "$GITHUB_WORKSPACE/test_library"
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g crates/ivm_metal_ffi/{library_bridge.c,test_library_bridge.c} target/debug/libivm_metal_ffi.a -ldl -lpthread -lm -o "$GITHUB_WORKSPACE/test_library_bridge"
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g crates/ivm_metal_ffi/test_render.c target/debug/libivm_metal_ffi.a -ldl -lpthread -lm -o "$GITHUB_WORKSPACE/test_render"
          clang -std=c11 -Wall -Wextra -Werror -DIVML_NO_STATIC_BACKEND -fsanitize=address,undefined -g crates/ivm_metal_ffi/{library_bridge.c,test_runtime.c} -ldl -o "$GITHUB_WORKSPACE/test_runtime"
          cp crates/metal2vulkan-validation/profiles/gate-lavapipe.json "$GITHUB_WORKSPACE/lavapipe.json"
          mkdir -p "$GITHUB_WORKSPACE/ffi-runtime"
          cp target/debug/libivm_metal_ffi.so "$GITHUB_WORKSPACE/ffi-runtime/"
          strip --strip-debug "$GITHUB_WORKSPACE/ffi-runtime/libivm_metal_ffi.so"
          file "$GITHUB_WORKSPACE/ffi-runtime/libivm_metal_ffi.so"
      - uses: actions/upload-artifact@v4
        with:
          name: metal-ffi-runtime-linux-arm64
          path: ffi-runtime/libivm_metal_ffi.so
          retention-days: 3
      - name: Install offline shader validator before receiving system shader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq spirv-tools
      # Input is fetched only AFTER building public code. Running the test has no network.
      - uses: actions/download-artifact@v4
        with:
          name: photos-metallib-scan-results
          path: /tmp/shaders
          run-id: '${{ inputs.scan_run }}'
          github-token: '${{ github.token }}'
      - uses: actions/download-artifact@v4
        with:
          name: photos-shader-sweep-results
          path: /tmp/reference-shaders
          run-id: '41014290466'
          github-token: '${{ github.token }}'
      - name: Test ownership, bounds and function lookup without network
        run: |
          set -euo pipefail
          IN=$(find /tmp/shaders -maxdepth 1 -name '*.metallib' -type f | head -1)
          test -n "$IN"
          sudo unshare -n -- "$GITHUB_WORKSPACE/test_library" "$IN"
          sudo unshare -n -- "$GITHUB_WORKSPACE/test_library_bridge" "$IN"
          sudo unshare -n -- "$GITHUB_WORKSPACE/test_runtime" "$GITHUB_WORKSPACE/ffi-runtime/libivm_metal_ffi.so" "$IN"
          sudo unshare -n -- "$GITHUB_WORKSPACE/test_render" "$IN" "$GITHUB_WORKSPACE/lavapipe.json" /tmp/test.vert.spv /tmp/test.frag.spv /tmp/test.metadata.json /tmp/test.plan.json
          cat /tmp/test.plan.json
          python3 - <<'PYCOMPARE'
          import json
          with open('/tmp/test.metadata.json') as f: actual=json.load(f)
          with open('/tmp/reference-shaders/pxg-0.json') as f: reference=json.load(f)
          for field in ('layout','interface','dependencies','vertex_input','graphics'):
              assert actual[field] == reference[field], field
          assert len(actual['stages']) == len(reference['stages']) == 2
          for a,b in zip(actual['stages'],reference['stages']):
              for field in ('entry_point','specialization','required_subgroup_size','stage_flags','precision_notes'):
                  assert a[field] == b[field], field
          PYCOMPARE
          cmp /tmp/test.vert.spv /tmp/reference-shaders/pxg-0.vert.spv
          cmp /tmp/test.frag.spv /tmp/reference-shaders/pxg-0.frag.spv
          # The pinned profile enables uniformBufferStandardLayout. The consumer
          # MUST enable the same feature; validation without it correctly fails.
          python3 - <<'PYCODE'
          import json
          d=json.load(open('lavapipe.json'))
          def find(x):
              if isinstance(x,dict):
                  return x.get('uniformBufferStandardLayout') is True or any(find(v) for v in x.values())
              return isinstance(x,list) and any(find(v) for v in x)
          assert find(d), 'profile must enable standard uniform buffer layout'
          PYCODE
          spirv-val --target-env vulkan1.2 --uniform-buffer-standard-layout /tmp/test.vert.spv
          spirv-val --target-env vulkan1.2 --uniform-buffer-standard-layout /tmp/test.frag.spv
          mkdir -p shader-ffi-out
          sudo cp /tmp/test.vert.spv shader-ffi-out/pxg-0.vert.spv
          sudo cp /tmp/test.frag.spv shader-ffi-out/pxg-0.frag.spv
          sudo cp /tmp/test.plan.json shader-ffi-out/plan.json
          sudo chown "$(id -u):$(id -g)" shader-ffi-out/*
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-compiled-system-shaders
          path: shader-ffi-out/
          retention-days: 3
  render:
    needs: build
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install clang and software Vulkan
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates git clang libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
      - uses: actions/checkout@v4
        with:
          repository: sahib3636-arch/ivm
          token: '${{ secrets.IVM_PAT }}'
          ref: '${{ inputs.ivm_ref }}'
          path: ivm-repo
          persist-credentials: false
          lfs: false
      - uses: actions/download-artifact@v4
        with: { name: ffi-compiled-system-shaders, path: /tmp/shaders }
      - name: Render synthetic pixels with FFI-compiled shaders and lavapipe
        shell: bash
        run: |
          set -euo pipefail
          ICD=$(find /usr/share/vulkan/icd.d -iname '*lvp*json' -type f | head -1); test -n "$ICD"
          export VK_ICD_FILENAMES="$ICD" VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation XDG_RUNTIME_DIR=/tmp
          D="$GITHUB_WORKSPACE/ivm-repo/ivm/lab/metal_cpu"
          python3 - <<'PYPLAN'
          import json
          d=json.load(open('/tmp/shaders/plan.json')); p=d['plan']; c=d['commands']
          assert d['schema']==1 and not c['push_holes'] and not c['descriptor_bytes'] and not c['root_tables']
          assert not c['specialization'] and not c['index_bounds_pass'] and not c['discards_command_buffer']
          assert c['draw']=={'Draw':{'first_instance':0,'first_vertex':0,'instance_count':1,'vertex_count':6}}
          ds=p['descriptors']; assert [x['binding'] for x in ds]==list(range(8))
          for i,x in enumerate(ds[:7]):
              assert x['set']==0 and x['array_element']==0 and x['ty']==(6 if i==0 else 7)
              assert x['source']['Buffer']['slot']=={'class':'Buffer','index':i,'stage':'Vertex'}
          image=ds[7]['source']['CombinedImageSampler']; assert ds[7]['ty']==1
          assert image['image']['Texture']['slot']=={'class':'Texture','index':0,'stage':'Fragment'}
          assert image['sampler']['Slot']['slot']=={'class':'Sampler','index':0,'stage':'Fragment'}
          ranges=c['descriptor_ranges']; assert [x['binding'] for x in ranges]==list(range(7))
          for x in ranges:
              r=x['range']; assert x['set']==0 and 0<=r['offset']<4096 and 0<r['range']<=4096-r['offset']
          push=c['push_constants']; assert len(push)==1 and push[0]['offset']==0 and push[0]['stages']==1 and len(push[0]['bytes'])==28
          with open('/tmp/ivm_plan_data.h','w') as f:
              for name,values in [('ivm_plan_offsets',[x['range']['offset'] for x in ranges]),('ivm_plan_ranges',[x['range']['range'] for x in ranges]),('ivm_plan_push',push[0]['bytes'])]:
                  f.write('static const unsigned '+name+'[] = {'+','.join(str(int(x)) for x in values)+'};\n' if name!='ivm_plan_push' else 'static const unsigned char '+name+'[] = {'+','.join(str(int(x)) for x in values)+'};\n')
          PYPLAN
          clang -std=c11 -Wall -Wextra -Werror -O2 -DIVM_USE_BIND_PLAN -include /tmp/ivm_plan_data.h "$D/pxg_vulkan_smoke.c" "$D/metal_cpu.c" -lvulkan -o /tmp/pxg_smoke
          for opacity in full half; do
            /tmp/pxg_smoke /tmp/shaders/pxg-0.vert.spv /tmp/shaders/pxg-0.frag.spv 0 "$opacity" 2>&1 | tee "/tmp/render-$opacity.log"
            if grep -Eq 'Validation Error|VUID-' "/tmp/render-$opacity.log"; then exit 1; fi
          done
