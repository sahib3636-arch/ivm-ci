# iVM APK build — runs in the PUBLIC ivm-ci so it costs no private-repo Actions minutes.
#
# Port of ivm/.github/workflows/ivm-apk.yml. Differences, all deliberate:
#  * the source repo is checked out into `ivm-repo/` (never this repo's own tree), via IVM_PAT,
#    because sahib3636-arch/ivm is private and this repo is not;
#  * every path is prefixed with ivm-repo/ (including the hashFiles() cache keys);
#  * the release is published to sahib3636-arch/ivm, so publishing needs IVM_PAT (contents:write),
#    not github.token — github.token can only write to THIS repo;
#  * version numbers are explicit inputs. In ivm-apk.yml they were derived from the run number
#    (4.0.(run+5), versionCode 150+run). Run numbers restart at 1 in this repo, which would
#    produce a versionCode far BELOW the installed app and Android would refuse the upgrade.
#    Defaults continue the sequence after 4.0.81 (versionCode 226) — bump them per build.
name: apk
on:
  workflow_dispatch:
    inputs:
      publish:  { description: 'upload to Gofile + release note (yes|no)', default: 'yes' }
      ivm_ref:  { description: 'branch/tag of sahib3636-arch/ivm to build', default: 'perf/e64-pgo-20261016' }
      version_name: { description: 'versionName', default: '4.0.82' }
      version_code: { description: 'versionCode (must exceed the installed one)', default: '227' }
      patches:  { description: 'IVM_PATCHES override (empty = the list below)', default: '' }
permissions: { contents: write }   # the public copy of the APK lives on a release in THIS repo
concurrency:
  group: apk-${{ github.ref }}-${{ inputs.version_name }}
  cancel-in-progress: false
env:
  APP: ivm-repo/ivm/lab/m6/apk/ivm-app
  SRC: sahib3636-arch/ivm
  # s47 engine: base 6541861f + 64 s46 patches (with native-int+ktrace flush fix, ktrace TTBR0 fast-gate + O(1) USET,
  # O(1) + lock-free Bloom Metal bridges, and hle-bilerp v4 4-px NEON) + 2 s47 patches (ptw-tlbi-fast, s24u-cores)
  # compiled with ARMv8.2-A LSE + RCPC + DotProd + FP16 hardware instructions.
  DEFAULT_PATCHES: >-
    panelhz android-perf fpslog hle-bilerp hle-nn inljc jcttbr0 fpixc fpixc_host fpzero fpden
    nobti jcbits14 asidlog cflagsinline jclog gxfinline zvainline adpdirty tlbrange vtlb16
    a13-ipi-replay haltpoll jcshared hle-lb hle-r3 hle-sob hle-zva hle-bq tbfollow tbfollow2
    tbfollow3 tbfollow4 zdiscard jitdiscard tbarray ucdyn adpf-honest ispstub ktrace metal-bridge-link monitor-watch-cleanup teardown-fastexit
    kexit cntfast nohardening tlbsz10 cpregcache panelwh shmfb paneladapt usb-ncm-net shmaudio
    rcu-idle-park dart-noreplay boot-stability tlb-ldp-fast tlb-accounting-dirty jc-preserve gxf-sprr-fast msr-fast2 native-fp native-int ras
    ptw-tlbi-fast s24u-cores
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false }
      - id: cache
        uses: actions/cache@v4
        with:
          path: ivm-repo/work/out
          # Every engine source must be in the key. The old key hashed a hand-picked list that left
          # out ivm/inferno/patches/exp/** — where shmfb, panelhz, ispstub, ucdyn and most of the real
          # work live — so a patch change restored a stale binary and the "fix" never ran on the phone
          # (4.0.83 and 4.0.85 restored the same f78207cb… both times). It also did not include this
          # workflow, so changing DEFAULT_PATCHES kept the old engine too. Hash the lot.
          # 'custom' keeps a one-off patch list (inputs.patches) out of the default key: an engine built
          # for an experiment must never be the engine a normal build restores.
          key: android-native-s47-${{ hashFiles('ivm-repo/ivm/android/ci/**', 'ivm-repo/ivm/inferno/**', 'ivm-repo/ivm/lab/metal_cpu/**', 'ivm-repo/ivm/lab/metal_ffi/**', 'ivm-repo/ivm/lab/metal_ffi_runtime/**', '.github/workflows/apk.yml') }}-${{ inputs.patches != '' && 'custom' || 'default' }}
      - name: host packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build patchelf python3-venv pkg-config cmake gcc && pipx install meson==1.7.0
      - name: merge PGO profile (explore-e64train, NDK llvm-profdata)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          W=$GITHUB_WORKSPACE/pgo-raw; rm -rf "$W"; mkdir -p "$W"
          unzip -q ivm-repo/ivm/android/ci/pgo/explore-e64train.zip -d "$W"
          PD=${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-profdata
          $PD --version | head -2
          $PD merge -o "$GITHUB_WORKSPACE/ivm.profdata" $(find "$W" -name '*.profraw')
          echo "IVM_PROFDATA=$GITHUB_WORKSPACE/ivm.profdata" >> "$GITHUB_ENV"
      - name: build Inferno for Android arm64
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ivm-repo
        env:
          INFERNO_COMMIT: "6541861f4d033a0de327b5ccc5180ebac20bf461"
          IVM_OPT_CFLAGS: "-O2 -march=armv8.2-a+lse+rcpc+dotprod+fp16"
          IVM_MESON_EXTRA: "-Db_lto=true -Db_lto_mode=thin"
          IVM_PATCHES: ${{ inputs.patches != '' && inputs.patches || env.DEFAULT_PATCHES }}
        run: |
          bash ivm/android/ci/build-inferno-android.sh 2>&1 | tee native.log; test "${PIPESTATUS[0]}" = 0
          bash ivm/android/ci/build-metal-android.sh 2>&1 | tee -a native.log; test "${PIPESTATUS[0]}" = 0
      - name: engine smoke test (real libinferno.so on qemu-user + Android 14 arm64 bionic)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ivm-repo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          bash ivm/android/ci/engine-smoke.sh work/out/jniLibs/arm64-v8a 2>&1 | tee work/out/engine-smoke.log; test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true     # artifact quota must never fail a build
        with: { name: ivm-native, path: ivm-repo/work/out }
  art-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false }
      - name: enable KVM + free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: fixtures (GNU tar --sparse, 32 GiB root)
        run: |
          sudo apt-get install -y -qq zstd >/dev/null
          bash $APP/tools/make-inferno-fixture.sh $APP/app/src/androidTest/assets
          mv $APP/app/src/androidTest/assets/fx-inferno.tar.gz $APP/app/src/androidTest/assets/fx-inferno.tar.gz.bin
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: JVM unit tests
        working-directory: ${{ env.APP }}
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest --tests 'dev.ivm.emu.InfernoPlanTest' --tests 'dev.ivm.emu.BootPlanTest' --tests 'dev.ivm.emu.KeymapTest' --tests 'dev.ivm.emu.ShmFbTest' --tests 'dev.ivm.emu.ShmAudioTest' --tests 'dev.ivm.emu.UsbMuxPairerTest' --tests 'dev.ivm.emu.InfernoStorageNetTest' --tests 'dev.ivm.emu.VncReconnectTest' --tests 'dev.ivm.emu.CamFeedTest' --tests 'dev.ivm.emu.PerfCoresTest' --tests 'dev.ivm.emu.LogExportTest'
      - name: import tests on ART (API 34 x86_64, R8-minified artTest build)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ env.APP }}
          script: bash tools/ci-art-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ivm-test-reports
          path: |
            ${{ env.APP }}/app/build/reports
            ${{ env.APP }}/app/build/outputs/androidTest-results
            /tmp/art-logcat.txt
  apk:
    needs: [native, art-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: sahib3636-arch/ivm, token: '${{ secrets.IVM_PAT }}', ref: '${{ inputs.ivm_ref }}', path: ivm-repo, lfs: false }
      # The engine comes from the actions cache (the key the native job saved), not from an
      # artifact: artifact storage is quota-limited and a quota miss must not break the APK.
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: ivm-repo/work/out
          # Every engine source must be in the key. The old key hashed a hand-picked list that left
          # out ivm/inferno/patches/exp/** — where shmfb, panelhz, ispstub, ucdyn and most of the real
          # work live — so a patch change restored a stale binary and the "fix" never ran on the phone
          # (4.0.83 and 4.0.85 restored the same f78207cb… both times). It also did not include this
          # workflow, so changing DEFAULT_PATCHES kept the old engine too. Hash the lot.
          # 'custom' keeps a one-off patch list (inputs.patches) out of the default key: an engine built
          # for an experiment must never be the engine a normal build restores.
          key: android-native-s47-${{ hashFiles('ivm-repo/ivm/android/ci/**', 'ivm-repo/ivm/inferno/**', 'ivm-repo/ivm/lab/metal_cpu/**', 'ivm-repo/ivm/lab/metal_ffi/**', 'ivm-repo/ivm/lab/metal_ffi_runtime/**', '.github/workflows/apk.yml') }}-${{ inputs.patches != '' && 'custom' || 'default' }}
          # s48: the native job saves its cache in a post step, i.e. after it has built. Any file the
          # build writes inside a hashed path changes the save key, so the apk job (which hashes a
          # pristine tree before building) can legitimately miss it — run 42689102750 died that way.
          # A release build must not depend on that: fall back to this run's native artifact.
          fail-on-cache-miss: false
      - name: engine from this run's native artifact (cache miss only)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with: { name: ivm-native, path: ivm-repo/work/out }
      - name: engine present
        run: |
          set -e
          ls -la ivm-repo/work/out/jniLibs/arm64-v8a
          test -f ivm-repo/work/out/jniLibs/arm64-v8a/libinferno.so
          test -f ivm-repo/work/out/jniLibs/arm64-v8a/libivm_metal_ffi.so
      - name: stage engines
        run: |
          M=$APP/app/src/main; J=$M/jniLibs/arm64-v8a; mkdir -p $J $M/assets
          cp -r ivm-repo/work/out/jniLibs/arm64-v8a/. $J/
          cp -r ivm-repo/work/out/assets/qemu-data $M/assets/
          ls -la $J $M/assets/qemu-data
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: assembleRelease
        working-directory: ${{ env.APP }}
        env:
          IVM_VERSION_CODE: ${{ inputs.version_code }}
          IVM_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g assembleRelease
      - name: verify signature + engine
        run: |
          set -e
          A=$(find $APP/app/build/outputs/apk/release -name '*.apk' | head -1); N=/tmp/iVM-${{ inputs.version_name }}.apk; cp "$A" "$N"
          unzip -l "$N" | grep -E 'lib/arm64-v8a/(libinferno|libivm_metal_ffi|libivm_vk_probe|libzstd-jni|libglib)'
          test "$(unzip -l "$N" | grep -Ec 'lib/arm64-v8a/(libinferno|libivm_metal_ffi|libivm_vk_probe)\.so')" -eq 3
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose --print-certs "$N" > /tmp/apksig.txt
          head -6 /tmp/apksig.txt
          grep -q "v3 scheme.*true" /tmp/apksig.txt || { echo "APK is NOT signed with v3 scheme"; exit 1; }
          # s48: the signing key must never drift - an APK signed with any other key cannot be
          # installed over the copy already on the phone ("App not installed"), and the only cure
          # is an uninstall that destroys the imported 5 GB disk set. Pin the certificate.
          SIGNER=$(grep -m1 "Signer #1 certificate SHA-256 digest:" /tmp/apksig.txt | awk '{print $NF}')
          echo "signer sha256: $SIGNER"
          test "$SIGNER" = "62a1fb139f573f102cf91f5ebd75ed9732490b8fd222023cdee3b246bf93b099" || {
            echo "SIGNING KEY CHANGED - refusing to publish an APK the phone cannot update"; exit 1; }
          echo "APK=$N" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: ivm-apk, path: '${{ env.APK }}' }
      - name: publish (Gofile + release note on the source repo)
        if: inputs.publish == 'yes'
        env:
          GH_TOKEN: '${{ secrets.IVM_PAT }}'   # must be able to write releases on $SRC, not just read
        run: |
          set -e
          # GITHUB_SHA here is ivm-ci, which tells a reader nothing about what was built.
          IVM_SHA=$(git -C ivm-repo rev-parse --short HEAD)
          R=$(curl -s -F "file=@$APK" https://upload.gofile.io/uploadfile); echo "$R" | head -c 400; echo
          LINK=$(echo "$R" | jq -r .data.downloadPage); MD5=$(md5sum "$APK" | cut -d' ' -f1); SZ=$(stat -c%s "$APK")
          [ "$(echo "$R" | jq -r .data.md5)" = "$MD5" ] || { echo "gofile md5 mismatch"; exit 1; }
          # s48: Gofile links have produced 'App not installed' reports that the build itself does
          # not explain (the uploaded bytes were verified). Also attach the APK to the release, so
          # there is a direct download whose bytes can be checked with `sha256sum`.
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          REL_ASSET="https://github.com/${{ github.repository }}/releases/download/apk-latest/$(basename $APK)"
          BODY="$(basename $APK) | $SZ B | md5 $MD5 | sha256 $SHA | $LINK | direct: $REL_ASSET | ivm $IVM_SHA (${{ inputs.ivm_ref }}) | apk run ${{ github.run_id }}"
          echo "$BODY" | tee -a $GITHUB_STEP_SUMMARY
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          id=$(curl -s "${H[@]}" https://api.github.com/repos/$SRC/releases/tags/ivm-apk-latest | jq -r '.id // empty')
          [ -n "$id" ] || id=$(curl -s "${H[@]}" -X POST https://api.github.com/repos/$SRC/releases -d '{"tag_name":"ivm-apk-latest","name":"ivm-apk-latest","prerelease":true,"body":"-"}' | jq -r .id)
          # Direct asset upload (clobbers the previous build's asset of the same name).
          UP="https://uploads.github.com/repos/$SRC/releases/$id/assets?name=$(basename $APK)"
          OLD=$(curl -s "${H[@]}" "https://api.github.com/repos/$SRC/releases/$id/assets" | jq -r '.[] | select(.name=="'"$(basename $APK)"'") | .id')
          [ -z "$OLD" ] || curl -s "${H[@]}" -X DELETE "https://api.github.com/repos/$SRC/releases/assets/$OLD"
          curl -s -X POST "${H[@]}" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK" "$UP" | head -c 200; echo
          jq -n --arg b "$BODY" '{body:$b}' | curl -s "${H[@]}" -X PATCH https://api.github.com/repos/$SRC/releases/$id -d @- >/dev/null
          # s48: the install happens on a phone, and an asset on the private repo needs a GitHub login
          # in a mobile browser. The same APK is also published on this (public) repo, so the direct
          # link works in any browser, with no account and no Gofile in between.
          PH=(-H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json")
          PUB=https://api.github.com/repos/${{ github.repository }}/releases
          PID=$(curl -s "${PH[@]}" "$PUB/tags/apk-latest" | jq -r '.id // empty')
          [ -n "$PID" ] || PID=$(curl -s "${PH[@]}" -X POST "$PUB" \
              -d '{"tag_name":"apk-latest","name":"iVM APK (latest)","prerelease":true,"body":"-"}' | jq -r .id)
          jq -n --arg b "$BODY" '{body:$b}' | curl -s "${PH[@]}" -X PATCH "$PUB/$PID" -d @- >/dev/null
          OLDID=$(curl -s "${PH[@]}" "$PUB/$PID/assets" | jq -r '.[] | select(.name=="'"$(basename $APK)"'") | .id')
          [ -z "$OLDID" ] || curl -s "${PH[@]}" -X DELETE "$PUB/$PID/assets/$OLDID"
          curl -s -X POST "${PH[@]}" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK" "https://uploads.github.com/repos/${{ github.repository }}/releases/$PID/assets?name=$(basename $APK)" | head -c 200; echo
