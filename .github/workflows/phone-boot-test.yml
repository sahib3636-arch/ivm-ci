# Boots the PHONE engine recipe headless in CI, to find out why the phone never draws.
# ios-boot-test builds a 3-patch x86 engine, which is NOT what the phone runs. This one builds the
# full phone patch chain (IVM_PATCHES, same list as apk.yml DEFAULT_PATCHES) and runs it twice:
#   shm=on  : IVM_SHM_FB_PATH set, so the engine mirrors frames into a shared file exactly like the phone
#             and the header (seq, size) is dumped at the end
#   shm=off : no shared file, VNC only (the path CI has always used)
name: phone-boot-test
on:
  workflow_dispatch:
    inputs:
      ivm_ref: { description: 'ivm repo ref (branch/commit)', default: 'fix/ram-6g-20261026' }
      patches: { description: 'IVM_PATCHES (empty = the phone list)', default: '' }
permissions: { actions: read, contents: read }
jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        shm: ['on', 'off']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sahib3636-arch/ivm
          path: ivm-repo
          token: ${{ secrets.IVM_PAT }}
          ref: '${{ inputs.ivm_ref }}'
      - name: Boot phone engine in Debian container (shm ${{ matrix.shm }})
        env:
          IVM_PAT: '${{ secrets.IVM_PAT }}'
          IVM_PATCHES_IN: '${{ inputs.patches }}'
          IVM_SHM: '${{ matrix.shm }}'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/boot-out"
          PHONE_PATCHES="panelhz android-perf fpslog hle-bilerp hle-nn inljc jcttbr0 fpixc fpixc_host fpzero fpden nobti jcbits14 asidlog cflagsinline jclog gxfinline zvainline adpdirty tlbrange vtlb16 a13-ipi-replay haltpoll jcshared hle-lb hle-r3 hle-sob hle-zva hle-bq tbfollow tbfollow2 tbfollow3 tbfollow4 zdiscard jitdiscard tbarray ucdyn ispstub ktrace monitor-watch-cleanup kexit cntfast nohardening tlbsz10 cpregcache panelwh shmfb paneladapt"
          export IVM_PATCHES_RUN="${IVM_PATCHES_IN:-$PHONE_PATCHES}"
          docker run --rm \
            -e IVM_PAT -e IVM_SHM -e IVM_PATCHES_RUN \
            -v "$GITHUB_WORKSPACE/ivm-repo":/home/user/ivm-repo \
            -v "$GITHUB_WORKSPACE/boot-out":/tmp/boot-out \
            -v /mnt:/opt \
            debian:trixie bash -c '
            set -x
            SRC=/home/user/ivm-repo
            O=/tmp/boot-out/$IVM_SHM
            mkdir -p "$O" /opt/b /opt/vm
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential git curl ca-certificates jq zstd python3 ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev libzstd-dev libpng-dev libjpeg-dev nettle-dev libgmp-dev liblzfse-dev libtasn1-6-dev zlib1g-dev liblz4-dev cmake clang
            mkdir -p /home/user/.tokens
            printf %s "$IVM_PAT" > /home/user/.tokens/github.pat
            chmod 600 /home/user/.tokens/github.pat
            mkdir -p /opt/dl
            bash $SRC/ivm/inferno/gh-release.sh get diskset-setupdone-18A5351d /opt/dl
            zstd -dc /opt/dl/*.tar.zst | tar -C /opt/vm -xS
            VMD=$(dirname "$(ls /opt/vm/*/entry.json | head -1)")
            echo "VM=$VMD"
            set -o pipefail
            IVM_PATCHES="$IVM_PATCHES_RUN" bash $SRC/ivm/bench/build-x86.sh HEAD /opt/b/eng > $O/build-x86.log 2>&1
            if [ ! -x /opt/b/eng ]; then echo "ENGINE_BUILD_FAILED"; tail -60 $O/build-x86.log; exit 1; fi
            set +o pipefail
            ls -lh /opt/b/eng
            QD=$(ls -d /opt/b/keymaps-* | head -1)
            mkdir -p /opt/qd && cp -r "$QD" /opt/qd/keymaps
            if [ "$IVM_SHM" = on ]; then
              # 828x1792 panel, same file layout the app creates: 4096-byte header + pixels
              python3 -c "import sys; open(sys.argv[1],\"wb\").write(bytes(4096 + 828*1792*4))" $O/shmfb.bin
              export IVM_SHM_FB_PATH=$O/shmfb.bin
            fi
            timeout 900 python3 -u $SRC/ivm/bench/bench.py /opt/b/eng /opt/qd "$VMD" "$O" "photos-ci" "4" "4G" "1024" 2>&1 | tee $O/boot.log | tail -40
            if [ "$IVM_SHM" = on ]; then
              python3 - "$O/shmfb.bin" > $O/shm-header.txt 2>&1 <<PYEOF
import struct, sys
b = open(sys.argv[1], "rb").read(4096)
magic, ver, w, h, stride, poff, flags, _r = struct.unpack_from("<8I", b, 0)
seq, dirty = struct.unpack_from("<QQ", b, 32)
print("magic=%#x ver=%d %dx%d stride=%d pixels_off=%d flags=%d seq=%d dirty_px=%d" % (magic, ver, w, h, stride, poff, flags, seq, dirty))
PYEOF
              cat $O/shm-header.txt
            fi
            grep -q "home settled" $O/boot.log && echo "BOOT_OK" || echo "BOOT_FAIL"
            grep -i "shmfb\|ivm-panel\|no frame" $O/boot.log | head -5
            grep -c "" $O/boot.log
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "phone-boot-${{ matrix.shm }}", path: boot-out/ }
